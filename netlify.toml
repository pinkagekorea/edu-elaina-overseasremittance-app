# ------------------------------------------------------------------
# Netlify 설정
# 빌드 단계 없음 — 정적 index.html 하나 + 함수 하나
# 열쇠는 이 파일에도 적지 않는다. Netlify 대시보드의 환경변수에만 둔다.
# ------------------------------------------------------------------

[build]
  publish   = "."
  functions = "netlify/functions"

# 함수 소스가 정적 파일로 그대로 내려가지 않도록 막는다.
# (열쇠는 코드에 없지만, 소스를 공개할 이유도 없다)
[[redirects]]
  from   = "/netlify/*"
  to     = "/index.html"
  status = 404
  force  = true

# publish = "." 이라 폴더 전체가 올라간다. 아래 두 가지는 사이트가 아니라
# 저장소의 기록이므로 공개 주소로 내려가지 않게 막는다.
# 비밀값은 없지만(열쇠는 전부 환경변수·Vault), 표 구조와 정책을
# 굳이 공개할 이유도 없다.
[[redirects]]
  from   = "/supabase/*"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/docs/*"
  to     = "/index.html"
  status = 404
  force  = true

# ------------------------------------------------------------------
# 홈 화면에 추가 (PWA)
# 서비스워커는 브라우저의 HTTP 캐시에 오래 머물면 안 된다. 오래 머물면
# sw.js 의 VERSION 을 올려도 폰이 옛 워커를 계속 써서 옛 화면이 남는다.
# ------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
