# ------------------------------------------------------------------
# Netlify 설정
# 빌드 단계 없음 — 정적 index.html 하나 + 함수 하나
# 열쇠는 이 파일에도 적지 않는다. Netlify 대시보드의 환경변수에만 둔다.
# ------------------------------------------------------------------

[build]
  publish   = "."
  functions = "netlify/functions"

# 함수 소스가 정적 파일로 그대로 내려가지 않도록 막는다.
# (열쇠는 코드에 없지만, 소스를 공개할 이유도 없다)
[[redirects]]
  from   = "/netlify/*"
  to     = "/index.html"
  status = 404
  force  = true
